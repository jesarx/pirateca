# Servidor del servicio onion de Pirateca.
#
# El demonio de Tor recibe el tráfico de la red y lo entrega aquí, en
# 127.0.0.1:8080. Este bloque escucha SOLO en loopback: nadie puede
# llegar a él desde internet, únicamente a través de Tor.
#
# Va en /etc/nginx/sites-available/pirateca-onion y se enlaza en
# sites-enabled. Reemplaza TU-DIRECCION.onion por la dirección real que
# genere Tor (aparece en /var/lib/tor/pirateca/hostname).

server {
    listen 127.0.0.1:8080;
    server_name TU-DIRECCION.onion;

    # Sin TLS a propósito: el cifrado y la autenticación del destino los
    # da la propia red Tor. Un certificado aquí no aportaría nada.

    client_max_body_size 600M;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/xml application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;

        # El Host original es lo que le dice a la app que la visita entró
        # por Tor: de ahí decide no generar enlaces al clearnet.
        proxy_set_header Host $host;

        # A propósito NO se manda X-Forwarded-For ni X-Real-IP: por Tor
        # la IP no identifica a nadie y no queremos ni verla.
        proxy_set_header X-Forwarded-Proto http;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
