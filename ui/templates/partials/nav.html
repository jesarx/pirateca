{{define "nav"}}
<header class="bg-brand shadow-sm">
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2.5">
    <a href="/" class="flex items-center gap-2.5">
      <img src="/static/images/logo-libro.png" alt="Pirateca" class="h-10 w-auto drop-shadow-sm">
      <span class="font-logo text-2xl lowercase text-snow">pirateca.com</span>
    </a>
    <nav class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-snow/85">
      <a href="/books" class="hover:text-snow {{if eq .CurrentPath "/books"}}font-bold text-snow underline underline-offset-4{{end}}">Libros</a>
      <a href="/authors" class="hover:text-snow {{if eq .CurrentPath "/authors"}}font-bold text-snow underline underline-offset-4{{end}}">Autores</a>
      <a href="/publishers" class="hover:text-snow {{if eq .CurrentPath "/publishers"}}font-bold text-snow underline underline-offset-4{{end}}">Editoriales</a>
      <a href="/tags" class="hover:text-snow {{if eq .CurrentPath "/tags"}}font-bold text-snow underline underline-offset-4{{end}}">Categorías</a>
      <a href="/manifest" class="hover:text-snow {{if eq .CurrentPath "/manifest"}}font-bold text-snow underline underline-offset-4{{end}}">Manifiesto</a>
      <a href="/contact" class="hover:text-snow {{if eq .CurrentPath "/contact"}}font-bold text-snow underline underline-offset-4{{end}}">Contacto</a>
    </nav>
    <div class="ml-auto flex items-center gap-x-3 text-sm">
      {{if .IsAuthenticated}}
      <a href="/dashboard" class="font-semibold text-snow hover:underline">Dashboard</a>
      <form method="POST" action="/admin/logout" class="inline">
        <button type="submit" class="cursor-pointer text-snow/75 hover:text-snow hover:underline">Salir</button>
      </form>
      {{end}}
      {{/* Switch de día/noche. Oculto hasta que corre el JS: sin JS
           (p. ej. Tor Browser en modo "Más seguro") no serviría de nada. */}}
      <button type="button" id="theme-toggle" hidden
        class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center rounded-full bg-black/20 p-0.5 ring-1 ring-snow/30 transition-colors hover:bg-black/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-snow"
        role="switch" aria-checked="false" aria-label="Modo noche" title="Modo noche">
        <span class="flex h-6 w-6 items-center justify-center rounded-full bg-snow text-brand shadow transition-transform duration-200 dark:translate-x-5">
          <svg class="h-3.5 w-3.5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="hidden h-3.5 w-3.5 dark:block" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>
{{end}}
