{{define "base"}}
<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} | Pirateca.com</title>
  <meta name="description" content="{{with .MetaDescription}}{{.}}{{else}}Pirateca: biblioteca digital libre. Los libros no se roban, ¡se expropian!{{end}}">
  <link rel="canonical" href="{{.BaseURL}}{{.CurrentPath}}">
  <meta property="og:site_name" content="Pirateca">
  <meta property="og:locale" content="es_MX">
  {{block "og" .}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{template "title" .}} | Pirateca.com">
  <meta property="og:description" content="{{with .MetaDescription}}{{.}}{{else}}Pirateca: biblioteca digital libre. Los libros no se roban, ¡se expropian!{{end}}">
  <meta property="og:url" content="{{.BaseURL}}{{.CurrentPath}}">
  <meta property="og:image" content="{{.BaseURL}}/static/images/logo.png">
  {{end}}
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css?v={{.CSSVersion}}">
  {{/* Aplica el modo noche ANTES de pintar, para que no parpadee. */}}
  <script>try{if(localStorage.getItem("pirateca-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
</head>
<body class="flex min-h-full flex-col bg-page font-sans text-gray-800">
  {{template "nav" .}}
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    {{template "main" .}}
  </main>
  {{template "footer" .}}
  <script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    function sync() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-checked", dark ? "true" : "false");
      btn.title = dark ? "Cambiar a modo día" : "Cambiar a modo noche";
    }
    btn.hidden = false;
    sync();
    btn.addEventListener("click", function () {
      var dark = root.getAttribute("data-theme") !== "dark";
      if (dark) root.setAttribute("data-theme", "dark");
      else root.removeAttribute("data-theme");
      try { localStorage.setItem("pirateca-theme", dark ? "dark" : "light"); } catch (e) {}
      sync();
    });
  })();
  </script>
</body>
</html>
{{end}}
